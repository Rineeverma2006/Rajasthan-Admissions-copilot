<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b192e"/>
      <stop offset="45%" stop-color="#1b365d"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="palaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="silhGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070f1e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#050a14" stop-opacity="0.98"/>
    </linearGradient>
    <pattern id="jaliPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#d97706" stroke-width="1" stroke-opacity="0.2"/>
      <circle cx="20" cy="20" r="4" fill="#f59e0b" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <rect width="1600" height="900" fill="url(#jaliPattern)"/>

  <!-- Sun / Dawn Aura -->
  <circle cx="800" cy="580" r="260" fill="#fde68a" opacity="0.2" filter="blur(40px)"/>
  <circle cx="800" cy="580" r="140" fill="#fbbf24" opacity="0.35"/>

  <!-- Distant Aravalli Hills -->
  <path d="M0 640 Q250 560 500 620 T1000 590 T1450 630 L1600 650 L1600 900 L0 900 Z" fill="#1b365d" opacity="0.75"/>
  <path d="M0 680 Q320 610 650 670 T1250 640 T1600 690 L1600 900 L0 900 Z" fill="#0f2342" opacity="0.9"/>

  <!-- Rajasthan Heritage Palace Silhouette (Hawa Mahal / Amber Fort inspired arches & jharokhas) -->
  <g fill="url(#silhGrad)">
    <!-- Central Grand Dome and Chhatris -->
    <path d="M740 540 Q800 460 860 540 Z" fill="#d97706" opacity="0.8"/>
    <rect x="760" y="540" width="80" height="60"/>
    <path d="M720 500 C720 450 880 450 880 500 Z"/>
    
    <!-- Left Chhatri -->
    <path d="M580 510 C580 470 640 470 640 510 Z"/>
    <rect x="590" y="510" width="40" height="90"/>
    <circle cx="610" cy="460" r="6" fill="#f59e0b"/>

    <!-- Right Chhatri -->
    <path d="M960 510 C960 470 1020 470 1020 510 Z"/>
    <rect x="970" y="510" width="40" height="90"/>
    <circle cx="990" cy="460" r="6" fill="#f59e0b"/>

    <!-- Main Architectural Pavilions -->
    <rect x="650" y="570" width="300" height="180" rx="8"/>
    <path d="M680 620 Q700 590 720 620 L720 720 L680 720 Z" fill="#fde68a" opacity="0.15"/>
    <path d="M740 620 Q760 590 780 620 L780 720 L740 720 Z" fill="#fde68a" opacity="0.2"/>
    <path d="M820 620 Q840 590 860 620 L860 720 L820 720 Z" fill="#fde68a" opacity="0.2"/>
    <path d="M880 620 Q900 590 920 620 L920 720 L880 720 Z" fill="#fde68a" opacity="0.15"/>

    <!-- Left Wing -->
    <rect x="340" y="610" width="320" height="150" rx="4"/>
    <rect x="220" y="650" width="130" height="120"/>
    <!-- Left Arches -->
    <path d="M370 650 Q390 625 410 650 L410 740 L370 740 Z" fill="#f59e0b" opacity="0.18"/>
    <path d="M440 650 Q460 625 480 650 L480 740 L440 740 Z" fill="#f59e0b" opacity="0.18"/>
    <path d="M510 650 Q530 625 550 650 L550 740 L510 740 Z" fill="#f59e0b" opacity="0.18"/>

    <!-- Right Wing -->
    <rect x="940" y="610" width="320" height="150" rx="4"/>
    <rect x="1250" y="650" width="130" height="120"/>
    <!-- Right Arches -->
    <path d="M1050 650 Q1070 625 1090 650 L1090 740 L1050 740 Z" fill="#f59e0b" opacity="0.18"/>
    <path d="M1120 650 Q1140 625 1160 650 L1160 740 L1120 740 Z" fill="#f59e0b" opacity="0.18"/>
    <path d="M1190 650 Q1210 625 1230 650 L1230 740 L1190 740 Z" fill="#f59e0b" opacity="0.18"/>

    <!-- Modern Academic Canopy & Campus Forecourt -->
    <path d="M0 760 L1600 740 L1600 900 L0 900 Z" fill="#070f1e"/>
  </g>

  <!-- Golden Lighting Trim -->
  <line x1="200" y1="760" x2="1400" y2="760" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
</svg>